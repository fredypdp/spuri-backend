openapi: 3.0.3
info:
  title: Spuri Event Sourcing API
  description: Sistema de gestão acadêmica com Event Sourcing e CQRS
  version: 3.0.0
  contact:
    name: Fundação Pedro Pires
    email: suporte@spuri.ao

servers:
  - url: http://localhost:8080
    description: Desenvolvimento
  - url: https://api.spuri.ao
    description: Produção

tags:
  - name: Autenticação
    description: Endpoints de login e registro
  - name: Email
    description: Verificação e recuperação de senha
  - name: Estudante
    description: Operações do estudante
  - name: Academia
    description: Operações da academia
  - name: Admin
    description: Operações administrativas
  - name: Sistema
    description: Saúde e métricas

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Health check básico
      responses:
        '200':
          description: Sistema operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
                  service:
                    type: string
                  version:
                    type: string

  /login:
    post:
      tags: [Autenticação]
      summary: Login estudante/academia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, senha, type]
              properties:
                usuario:
                  type: string
                  description: Código estudante ou código academia
                senha:
                  type: string
                type:
                  type: string
                  enum: [estudante, academia]
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  codigo:
                    type: string
                  nome:
                    type: string
                  type:
                    type: string

  /admin/login:
    post:
      tags: [Autenticação]
      summary: Login administrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                senha:
                  type: string
      responses:
        '200':
          description: Login bem-sucedido

  /estudante/register:
    post:
      tags: [Autenticação]
      summary: Registrar estudante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senha, nome]
              properties:
                senha:
                  type: string
                  minLength: 6
                nome:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                telefone:
                  type: string
                bilhete_identidade:
                  type: string
                bilhete_identidade_responsavel:
                  type: string
                ano_escolar:
                  type: string
                ano_superior:
                  type: string
                curso_medio:
                  type: string
                curso_superior:
                  type: string
                status_escolar:
                  type: string
                  enum: [inativo, em_andamento, finalizado]
                status_superior:
                  type: string
                  enum: [inativo, em_andamento, finalizado]
      responses:
        '201':
          description: Estudante criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      codigo_estudante:
                        type: string

  /academia/register:
    post:
      tags: [Autenticação]
      summary: Registrar academia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, senha, nome, provincia, endereco]
              properties:
                type:
                  type: string
                  enum: [escola, superior]
                senha:
                  type: string
                  minLength: 6
                nome:
                  type: string
                provincia:
                  type: string
                endereco:
                  type: string
                numero_telefone:
                  type: string
                email:
                  type: string
                website:
                  type: string
                nivel_escolar:
                  type: string
                  enum: [fundamental, medio, misto]
                cursos:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Academia criada

  /bootstrap/admin-fpp:
    post:
      tags: [Admin]
      summary: Criar primeiro admin FPP
      description: Só funciona se não existir nenhum admin no sistema
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  default: Admin FPP
                email:
                  type: string
                  default: admin@spuri.ao
                senha:
                  type: string
                  default: fpp@2025
      responses:
        '201':
          description: Admin FPP criado

  /verificar-email/{token}:
    get:
      tags: [Email]
      summary: Verificar email com token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verificado

  /recuperar-senha/solicitar:
    post:
      tags: [Email]
      summary: Solicitar recuperação de senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificador, tipo]
              properties:
                identificador:
                  type: string
                  description: Email ou código
                tipo:
                  type: string
                  enum: [estudante, academia, admin]
      responses:
        '200':
          description: Email enviado

  /alterar-senha:
    put:
      tags: [Autenticação]
      summary: Alterar senha (autenticado)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senha_atual, nova_senha]
              properties:
                senha_atual:
                  type: string
                nova_senha:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Senha alterada

  /meu-perfil:
    get:
      tags: [Autenticação]
      summary: Ver perfil do usuário logado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário

  /academias:
    get:
      tags: [Academia]
      summary: Listar todas academias (público)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de academias

  /estudantes:
    get:
      tags: [Estudante]
      summary: Listar estudantes (academia/admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de estudantes

  /notas-estudante/{codigo}:
    get:
      tags: [Estudante]
      summary: Ver notas de estudante
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notas do estudante

  /faltas-estudante/{codigo}:
    get:
      tags: [Estudante]
      summary: Ver faltas de estudante
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Faltas do estudante

  /estudante/inscricao-escola:
    post:
      tags: [Estudante]
      summary: Solicitar inscrição em escola
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo_academia, ano_escolar_inscricao]
              properties:
                codigo_academia:
                  type: string
                ano_escolar_inscricao:
                  type: string
                curso_medio:
                  type: string
      responses:
        '201':
          description: Inscrição solicitada

  /estudante/vincular-academia:
    post:
      tags: [Estudante]
      summary: Vincular-se a academia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inscricao_id]
              properties:
                inscricao_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Vinculado com sucesso

  /academia/notas-aluno:
    post:
      tags: [Academia]
      summary: Registrar notas de aluno
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo_estudante, ano_lectivo, periodo, materia_disciplinar_id, nota]
              properties:
                codigo_estudante:
                  type: string
                ano_lectivo:
                  type: string
                periodo:
                  type: string
                  enum: [1_trimestre, 2_trimestre, 3_trimestre, 1_semestre, 2_semestre]
                materia_disciplinar_id:
                  type: string
                  format: uuid
                nota:
                  type: number
                  minimum: 0
                  maximum: 20
                observacao:
                  type: string
      responses:
        '200':
          description: Nota registrada

  /academia/faltas-aluno:
    post:
      tags: [Academia]
      summary: Registrar faltas de aluno
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo_estudante, ano_lectivo, data, materia_disciplinar_id, quantidade]
              properties:
                codigo_estudante:
                  type: string
                ano_lectivo:
                  type: string
                data:
                  type: string
                  format: date
                materia_disciplinar_id:
                  type: string
                  format: uuid
                quantidade:
                  type: integer
                  minimum: 1
                observacao:
                  type: string
      responses:
        '200':
          description: Faltas registradas

  /academia/inscricao/{id}/aprovar:
    put:
      tags: [Academia]
      summary: Aprovar inscrição
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inscrição aprovada

  /academia/cursos:
    post:
      tags: [Academia]
      summary: Criar curso
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, type, nivel]
              properties:
                nome:
                  type: string
                type:
                  type: string
                  enum: [medio, superior]
                nivel:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Curso criado

    get:
      tags: [Academia]
      summary: Listar cursos da academia
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de cursos

  /academia/materias:
    post:
      tags: [Academia]
      summary: Criar matéria
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, type]
              properties:
                nome:
                  type: string
                type:
                  type: string
                  enum: [fundamental, medio, superior]
                nivel:
                  type: array
                  items:
                    type: string
                curso_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Matéria criada

  /admin/register:
    post:
      tags: [Admin]
      summary: Criar admin (ADM+)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha, role]
              properties:
                nome:
                  type: string
                email:
                  type: string
                senha:
                  type: string
                role:
                  type: string
                  enum: [fpp, adm, gerente]
      responses:
        '201':
          description: Admin criado

  /admin/academia/{codigo}/ativar:
    put:
      tags: [Admin]
      summary: Ativar academia (GERENTE+)
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Academia ativada

  /admin/metrics:
    get:
      tags: [Sistema]
      summary: Métricas do sistema (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Métricas coletadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: object
                    properties:
                      uptime_seconds:
                        type: number
                      total_requests:
                        type: integer
                      total_errors:
                        type: integer
                      requests_per_second:
                        type: number
                      error_rate:
                        type: number

  /admin/rebuild-projection/{name}:
    post:
      tags: [Admin]
      summary: Reconstruir projeção
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [estudantes, academias, admins, notas, faltas, inscricoes, cursos, materias]
      responses:
        '200':
          description: Projeção reconstruída

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        request_id:
          type: string